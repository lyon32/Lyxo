version: 2
updates:
  # App mobile (lyxo-app, racine du repo)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      expo-ecosystem:
        patterns:
          - "expo*"
          - "react-native*"
      dev-dependencies:
        dependency-type: development
    open-pull-requests-limit: 10

  # Backend (lyxo-api)
  - package-ecosystem: npm
    directory: "/backend"
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    open-pull-requests-limit: 10

  # GitHub Actions elles-mêmes
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
